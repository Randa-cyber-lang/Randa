<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pesan Kece</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f8ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  input[type="text"] {
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #007BFF;
    outline: none;
    width: 200px;
  }

  button {
    padding: 10px 20px;
    margin-left: 10px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    background-color: #007BFF;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background-color: #0056b3;
  }

  .message-box {
    margin-top: 20px;
    padding: 20px;
    background-color: #007BFF;
    color: white;
    border-radius: 10px;
    font-size: 18px;
    width: 250px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<h2>Masukkan Nama Kamu</h2>
<div>
  <input type="text" id="nameInput" placeholder="Nama kamu...">
  <button onclick="showMessage()">Kirim</button>
</div>

<div id="messageContainer"></div>

<script>
  function showMessage() {
    const name = document.getElementById('nameInput').value.trim();
    if(name === "") return; // jika kosong tidak muncul
    const container = document.getElementById('messageContainer');
    container.innerHTML = `<div class="message-box">Halo ${name}!</div>`;
  }
</script>

</body>
</html>
